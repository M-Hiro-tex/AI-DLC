name: CD - U2 Authentication

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write   # Required for OIDC
  contents: read

defaults:
  run:
    working-directory: u2-authentication

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: u2-authentication/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Package for deployment
        run: |
          mkdir -p dist/node_modules
          npm ci --production
          cp -r node_modules/* dist/node_modules/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: u2-authentication/dist/
          retention-days: 30

  deploy:
    name: Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ steps.deploy.outputs.api_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: u2-authentication/dist/
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: u2-authentication/infrastructure/package-lock.json
      
      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci
      
      - name: Deploy with CDK
        id: deploy
        env:
          STAGE: ${{ needs.determine-environment.outputs.environment }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          cd infrastructure
          npm run build
          npx cdk deploy \
            --context stage=${STAGE} \
            --context alertEmail=${ALERT_EMAIL} \
            --require-approval never \
            --outputs-file outputs.json
          
          # Extract API URL from outputs
          API_URL=$(cat outputs.json | jq -r '.["U2AuthenticationStack-'${STAGE}'"].ApiUrl')
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
      
      - name: Run database migrations
        env:
          STAGE: ${{ needs.determine-environment.outputs.environment }}
        run: |
          # Get database credentials from Secrets Manager
          DB_CREDS_SECRET=$(aws cloudformation describe-stacks \
            --stack-name U2AuthenticationStack-${STAGE} \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabaseCredentialsSecret`].OutputValue' \
            --output text)
          
          DB_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name U2AuthenticationStack-${STAGE} \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabaseEndpoint`].OutputValue' \
            --output text)
          
          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name U2AuthenticationStack-${STAGE} \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabasePort`].OutputValue' \
            --output text)
          
          DB_CREDS=$(aws secretsmanager get-secret-value \
            --secret-id $DB_CREDS_SECRET \
            --query SecretString \
            --output text)
          
          DB_USERNAME=$(echo $DB_CREDS | jq -r '.username')
          DB_PASSWORD=$(echo $DB_CREDS | jq -r '.password')
          
          # Run migrations
          export PGHOST=$DB_ENDPOINT
          export PGPORT=$DB_PORT
          export PGUSER=$DB_USERNAME
          export PGPASSWORD=$DB_PASSWORD
          export PGDATABASE=authentication
          
          # Apply migrations
          for migration in src/db/migrations/*.sql; do
            echo "Applying $(basename $migration)..."
            psql -f $migration || echo "Migration already applied or failed"
          done
      
      - name: Run smoke tests
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          # Test health endpoint
          echo "Testing health endpoint: ${API_URL}/health"
          response=$(curl -s -o /dev/null -w "%{http_code}" ${API_URL}/health)
          
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          
          echo "Health check passed!"
      
      - name: Save deployment metadata
        env:
          STAGE: ${{ needs.determine-environment.outputs.environment }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          cat > deployment-${STAGE}.json <<EOF
          {
            "stage": "${STAGE}",
            "deploymentTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "apiUrl": "${API_URL}",
            "gitCommit": "${{ github.sha }}",
            "gitRef": "${{ github.ref }}",
            "deployedBy": "${{ github.actor }}"
          }
          EOF
      
      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-${{ needs.determine-environment.outputs.environment }}
          path: u2-authentication/deployment-*.json
          retention-days: 90

  notify-success:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    if: success()
    
    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ U2 Authentication deployed to ${{ needs.determine-environment.outputs.environment }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* ✅\n*Environment:* ${{ needs.determine-environment.outputs.environment }}\n*Commit:* ${{ github.sha }}\n*Deployed by:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  notify-failure:
    name: Notify Deployment Failure
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    if: failure()
    
    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ U2 Authentication deployment to ${{ needs.determine-environment.outputs.environment }} failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\n*Environment:* ${{ needs.determine-environment.outputs.environment }}\n*Commit:* ${{ github.sha }}\n*Deployed by:* ${{ github.actor }}\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Create rollback issue
        if: needs.determine-environment.outputs.environment == 'prod'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production Deployment Failed - Rollback Required`,
              body: `Production deployment failed for commit ${context.sha}.\n\nPlease investigate and consider rollback.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deployment', 'critical', 'production']
            })